name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  schema:
    name: Validate DB entries against schema v1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate entries + examples
        run: python scripts/validate.py

  tests:
    name: Run collector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "stable"

      - name: Install collector dependencies
        run: pip install -r collector/requirements.txt

      - name: Install Dart helper dependencies
        run: dart pub get
        working-directory: collector/dart_helper

      - name: Analyze Dart helper
        run: dart analyze
        working-directory: collector/dart_helper

      - name: Run unit tests
        run: python -m unittest discover -v
