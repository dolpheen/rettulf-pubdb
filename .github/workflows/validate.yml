name: validate

on:
  pull_request:
  push:
    branches: [main]

env:
  RUN_NETWORK_TESTS: ${{ vars.RUN_NETWORK_TESTS }}

jobs:
  schema:
    name: Validate DB entries against schema v1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate entries + examples
        run: python scripts/validate.py

  tests:
    name: Run collector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "stable"

      - name: Install collector dependencies
        run: pip install -r collector/requirements.txt

      - name: Install Dart helper dependencies
        run: dart pub get
        working-directory: collector/dart_helper

      - name: Analyze Dart helper
        run: dart analyze
        working-directory: collector/dart_helper

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Run daemon network smoke
        if: env.RUN_NETWORK_TESTS == '1'
        run: |
          set -euo pipefail
          git config user.name "rettulf-pubdb CI"
          git config user.email "actions@github.com"

          before="$(git rev-list --count HEAD)"
          python -m collector.daemon \
            --once \
            --packages provider \
            --no-push \
            --no-metrics \
            --queue-db "$RUNNER_TEMP/queue.db" \
            --archive-cache-dir "$RUNNER_TEMP/archives"
          after="$(git rev-list --count HEAD)"
          test "$after" -eq "$((before + 1))"

          mapfile -t entries < <(
            git diff-tree --no-commit-id --name-only -r HEAD \
              | grep '^db/provider/.*\.json$'
          )
          test "${#entries[@]}" -eq 1
          python scripts/validate.py "${entries[0]}"

  docker-smoke:
    name: Build collector image + --once smoke
    runs-on: ubuntu-latest
    # Builds the image (apt/Dart over the network) and hits real pub.dev, so
    # it only runs when the org/repo opts in via the RUN_NETWORK_TESTS variable.
    if: ${{ vars.RUN_NETWORK_TESTS == '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build collector image
        run: docker build -f ops/docker/Dockerfile.collector -t rettulf-pubdb-collector:ci .

      - name: Report image size (target < 3 GB)
        run: docker image ls rettulf-pubdb-collector:ci

      - name: Run --once against pub.dev (no push) and assert a valid entry
        run: |
          set -euo pipefail
          before="$(git rev-list --count HEAD)"
          docker run --rm \
            -e NO_PUSH=1 \
            -e REPO_ROOT=/app \
            -v "$PWD:/app" \
            rettulf-pubdb-collector:ci \
            --once --no-metrics --packages provider
          after="$(git rev-list --count HEAD)"
          test "$after" -eq "$((before + 1))"

          mapfile -t entries < <(
            git diff-tree --no-commit-id --name-only -r HEAD \
              | grep '^db/provider/.*\.json$'
          )
          test "${#entries[@]}" -eq 1
          pip install -r scripts/requirements.txt
          python scripts/validate.py "${entries[0]}"
