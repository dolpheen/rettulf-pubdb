name: validate

on:
  pull_request:
  push:
    branches: [main]

env:
  RUN_NETWORK_TESTS: ${{ vars.RUN_NETWORK_TESTS }}

jobs:
  schema:
    name: Validate DB entries against schema v1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate entries + examples
        run: python scripts/validate.py

  tests:
    name: Run collector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "stable"

      - name: Install collector dependencies
        run: pip install -r collector/requirements.txt

      - name: Install Dart helper dependencies
        run: dart pub get
        working-directory: collector/dart_helper

      - name: Analyze Dart helper
        run: dart analyze
        working-directory: collector/dart_helper

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Run daemon network smoke
        if: env.RUN_NETWORK_TESTS == '1'
        run: |
          set -euo pipefail
          git config user.name "rettulf-pubdb CI"
          git config user.email "actions@github.com"

          before="$(git rev-list --count HEAD)"
          python -m collector.daemon \
            --once \
            --packages provider \
            --no-push \
            --no-metrics \
            --queue-db "$RUNNER_TEMP/queue.db" \
            --archive-cache-dir "$RUNNER_TEMP/archives"
          after="$(git rev-list --count HEAD)"
          test "$after" -eq "$((before + 1))"

          mapfile -t entries < <(
            git diff-tree --no-commit-id --name-only -r HEAD \
              | grep '^db/provider/.*\.json$'
          )
          test "${#entries[@]}" -eq 1
          python scripts/validate.py "${entries[0]}"
